<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine Status Checker</title>

  <style>
    body {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    [hidden] {
      display: none;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: #176b9a;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <section id="welcomePage">
    <h1>Machine Status Checker</h1>
    <p>This app displays pump, CNC, and compressor readings and statuses.</p>
    <button type="button" id="openAppButton">Open data and status page</button>
  </section>

  <main id="appPage" hidden>
    <button type="button" id="backButton">Back to welcome page</button>
    <h1>Data and Status</h1>
    <p>The welcome page is working.</p>
  </main>

  <script>
    const welcomePage = document.getElementById("welcomePage");
    const appPage = document.getElementById("appPage");

    document.getElementById("openAppButton").addEventListener("click", () => {
      welcomePage.hidden = true;
      appPage.hidden = false;
    });

    document.getElementById("backButton").addEventListener("click", () => {
      appPage.hidden = true;
      welcomePage.hidden = false;
    });
  </script>
</body>
</html>
